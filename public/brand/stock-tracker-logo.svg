<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Stock Tracker Logo</title>
  <desc id="desc">Stock Tracker wordmark with a premium blue budget ledger mark.</desc>
  <defs>
    <linearGradient id="markBase" x1="12%" y1="10%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#1f57f3"/>
      <stop offset="55%" stop-color="#3f86ff"/>
      <stop offset="100%" stop-color="#7bc5ff"/>
    </linearGradient>
    <linearGradient id="markGlass" x1="20%" y1="10%" x2="84%" y2="92%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#ecf4ff" stop-opacity="0.84"/>
    </linearGradient>
    <linearGradient id="trendStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#255af6"/>
      <stop offset="100%" stop-color="#63b7ff"/>
    </linearGradient>
    <linearGradient id="wordFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#183a8f"/>
      <stop offset="100%" stop-color="#255af6"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#255af6" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g transform="translate(28,24)" filter="url(#softShadow)">
    <rect x="0" y="0" width="228" height="228" rx="70" fill="url(#markBase)"/>
    <rect x="20" y="18" width="188" height="190" rx="58" fill="url(#markGlass)" stroke="#d5e4ff" stroke-width="2"/>
    <rect x="48" y="44" width="132" height="24" rx="12" fill="#dce8ff"/>
    <rect x="48" y="92" width="74" height="12" rx="6" fill="#d8e5ff"/>
    <rect x="48" y="124" width="106" height="12" rx="6" fill="#d8e5ff"/>
    <rect x="48" y="156" width="84" height="12" rx="6" fill="#d8e5ff"/>
    <path d="M54 164L92 138L126 148L160 118L184 92" fill="none" stroke="url(#trendStroke)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M164 92H198V126" fill="none" stroke="url(#trendStroke)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="92" cy="138" r="10" fill="#ffffff" stroke="#8fbcff" stroke-width="5"/>
    <circle cx="126" cy="148" r="10" fill="#ffffff" stroke="#8fbcff" stroke-width="5"/>
    <circle cx="160" cy="118" r="10" fill="#ffffff" stroke="#8fbcff" stroke-width="5"/>
  </g>

  <g transform="translate(300,56)">
    <text x="0" y="78" font-family="'Inter', 'Segoe UI', sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="url(#wordFill)">Stock</text>
    <text x="0" y="148" font-family="'Inter', 'Segoe UI', sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="#10203b">Tracker</text>
    <text x="4" y="190" font-family="'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="600" letter-spacing="1.4" fill="#5c6e8b">PERSONAL BUDGET CLARITY, MONTH BY MONTH.</text>
  </g>
</svg>
