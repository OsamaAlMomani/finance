<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Stock Tracker Mark</title>
  <desc id="desc">Premium blue budget ledger mark with a rising trend line.</desc>
  <defs>
    <linearGradient id="markBase" x1="12%" y1="10%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#1f57f3"/>
      <stop offset="55%" stop-color="#3f86ff"/>
      <stop offset="100%" stop-color="#7bc5ff"/>
    </linearGradient>
    <linearGradient id="cardFace" x1="18%" y1="8%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#ecf4ff" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="trendStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#255af6"/>
      <stop offset="100%" stop-color="#63b7ff"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#255af6" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="132" fill="url(#markBase)"/>
  <rect x="48" y="42" width="416" height="424" rx="116" fill="rgba(255,255,255,0.08)"/>

  <g filter="url(#softShadow)">
    <rect x="74" y="66" width="364" height="380" rx="92" fill="url(#cardFace)" stroke="#d7e4ff" stroke-width="3"/>
    <rect x="122" y="122" width="204" height="34" rx="17" fill="#dce8ff"/>
    <rect x="122" y="188" width="116" height="16" rx="8" fill="#d8e5ff"/>
    <rect x="122" y="230" width="164" height="16" rx="8" fill="#d8e5ff"/>
    <rect x="122" y="272" width="132" height="16" rx="8" fill="#d8e5ff"/>
    <path d="M132 298L196 254L256 272L320 214L374 174" fill="none" stroke="url(#trendStroke)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M334 174H394V234" fill="none" stroke="url(#trendStroke)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="196" cy="254" r="18" fill="#ffffff" stroke="#9bc7ff" stroke-width="8"/>
    <circle cx="256" cy="272" r="18" fill="#ffffff" stroke="#9bc7ff" stroke-width="8"/>
    <circle cx="320" cy="214" r="18" fill="#ffffff" stroke="#9bc7ff" stroke-width="8"/>
  </g>
</svg>
